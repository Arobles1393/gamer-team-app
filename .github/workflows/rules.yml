# Pruebas que no tocan producción ni usan secretos:
# - firestore.rules en el emulador (npm run test:rules, proyecto demo-)
# - protección SSRF de fetchLinkPreview y demás funciones puras (npm run test:functions, sin internet)
# - getJoinInfo contra el emulador de Firestore (npm run test:functions:emulator)
# - funciones puras del cliente con Jest (npm run test:unit)
# - lint de functions (el mismo del predeploy de firebase.json) y de la app
# - build de producción de la app (sin .env: solo comprueba que compila) y
#   que los créditos/licencias generados estén al día
name: Reglas de Firestore

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  rules:
    name: Pruebas de reglas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # El emulador de Firestore corre sobre Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El .jar del emulador se descarga la primera vez
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.35.1

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - run: npm run test:rules

      - run: npm run test:functions

      # El mismo lint que corre antes de desplegar las funciones (predeploy)
      - run: npm run lint
        working-directory: functions

      - run: npm run test:functions:emulator

      - run: npm run test:unit

      # Lint de la app sin avisos (el build de CRA con CI=true también los
      # trata como errores)
      - run: npm run lint

      # prebuild regenera Créditos y licencias: si cambian, faltó correr
      # `npm run credits:generate` al agregar o actualizar una dependencia
      - run: npm run build
        env:
          CI: true

      - name: Créditos y licencias al día
        run: git diff --exit-code src/credits/openSourceLibraries.json public/third-party-licenses.txt
