<!DOCTYPE html>
<!-- Idioma inicial; i18n.js lo cambia al idioma de la persona al cargar -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GamerMatch</title>
    <meta
      name="description"
      content="GamerMatch: encuentra jugadores y arma tu squad para tu próxima partida."
    />
    <meta name="theme-color" content="#0F0F23" />

    <!-- Íconos: generados a partir de la insignia "GM" del menú -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Vista previa al compartir un enlace (WhatsApp, Discord, redes).
         Las imágenes necesitan la URL completa: REACT_APP_SITE_URL en
         .env.production / .env.development -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GamerMatch" />
    <meta property="og:title" content="GamerMatch" />
    <meta property="og:description" content="Encuentra jugadores y arma tu squad para tu próxima partida." />
    <meta property="og:url" content="%REACT_APP_SITE_URL%/" />
    <meta property="og:image" content="%REACT_APP_SITE_URL%/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GamerMatch: encuentra jugadores y arma tu squad" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar GamerMatch. · You need to enable JavaScript to use GamerMatch.</noscript>
    <div id="root"></div>
  </body>
</html>
